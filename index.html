<!doctype html>
<html lang="en">
  <head>
    <script>
      // Set the theme + accent color before first paint to avoid a flash of
      // the wrong colors. Duplicates the hue/sat->rgb and ink logic from
      // main.js (hslToRgb/computeAccentInk) since this must run standalone,
      // before any module loads.
      (function () {
        var saved = localStorage.getItem('theme');
        var theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        document.documentElement.setAttribute('data-theme', theme);

        var hue = Number(localStorage.getItem('accentHue'));
        var sat = Number(localStorage.getItem('accentSat'));
        if (!(isFinite(hue) && hue >= 0 && hue <= 360)) hue = null;
        if (!(isFinite(sat) && sat >= 0 && sat <= 100)) sat = null;

        if (hue !== null && sat !== null) {
          var s = sat / 100,
            l = 0.55;
          var k = function (n) {
            return (n + hue / 30) % 12;
          };
          var a = s * Math.min(l, 1 - l);
          var f = function (n) {
            return l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
          };
          var r = Math.round(f(0) * 255),
            g = Math.round(f(8) * 255),
            b = Math.round(f(4) * 255);
          document.documentElement.style.setProperty('--accent', 'rgb(' + r + ', ' + g + ', ' + b + ')');
          document.documentElement.style.setProperty('--accent-rgb', r + ', ' + g + ', ' + b);
          var isLightHue = (hue > 25 && hue < 195) || sat < 30;
          document.documentElement.style.setProperty('--accent-ink', isLightHue ? '#1a1d21' : '#ffffff');
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1d21" />
    <link rel="icon" href="/music-streamer/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/music-streamer/icons/icon-192.png" />
    <title>Music Streamer</title>
    <script type="module" crossorigin src="/music-streamer/assets/index-BD9GgpUp.js"></script>
    <link rel="modulepreload" crossorigin href="/music-streamer/assets/BasicParser-CQ38SJP4.js">
    <link rel="modulepreload" crossorigin href="/music-streamer/assets/Errors-DphxX0j4.js">
    <link rel="stylesheet" crossorigin href="/music-streamer/assets/index-BgvoHfDt.css">
  <link rel="manifest" href="/music-streamer/manifest.webmanifest"></head>
  <body>
    <div id="app">
      <header id="topbar">
        <div id="topbar-row1">
          <h1>Music</h1>
          <div class="topbar-actions">
            <button id="add-btn" class="btn icon-btn" title="Add music"></button>
            <button id="settings-btn" class="btn icon-btn" title="Settings"></button>
          </div>
        </div>
        <div id="topbar-row2">
          <input id="search" type="search" placeholder="Search library…" />
        </div>
      </header>

      <div id="import-status" class="hidden" role="status">
        <div id="import-bar"><div id="import-bar-fill"></div></div>
        <span id="import-text"></span>
      </div>

      <main id="library">
        <p id="empty-state">
          Your library is empty. Tap <strong>＋ Files</strong> or <strong>＋ Folder</strong>
          to import music from your phone's storage. Once imported, it's saved
          on-device and plays with no internet connection needed.
        </p>
        <ul id="track-list"></ul>
      </main>

      <footer id="player-bar" class="hidden">
        <div id="now-playing">
          <div id="np-title">—</div>
        </div>

        <div id="seek-row">
          <span id="time-current">0:00</span>
          <input id="seek" type="range" min="0" max="1000" value="0" />
          <span id="time-total">0:00</span>
        </div>

        <div id="controls">
          <div id="transport">
            <button id="shuffle-btn" class="ctrl" title="Shuffle">🔀</button>
            <button id="prev-btn" class="ctrl" title="Previous">⏮</button>
            <button id="play-btn" class="ctrl big" title="Play/Pause">▶</button>
            <button id="next-btn" class="ctrl" title="Next">⏭</button>
            <button id="repeat-btn" class="ctrl" title="Repeat">🔁</button>
          </div>
          <div id="volume-control">
            <button id="volume-btn" class="ctrl" title="Mute">🔊</button>
            <input id="volume" type="range" min="0" max="100" value="100" />
          </div>
        </div>
      </footer>
    </div>

    <input type="file" id="file-input" accept="audio/*,.flac,.m4a,.ogg,.wav,.mp3" multiple hidden />
    <input type="file" id="folder-input" webkitdirectory multiple hidden />
    <audio id="audio" preload="metadata"></audio>
    <div id="toast" role="status"></div>

    <div id="action-sheet" class="sheet-overlay hidden">
      <div id="action-sheet-backdrop" class="sheet-backdrop"></div>
      <div id="action-sheet-panel" class="sheet-panel">
        <button id="action-rename" class="sheet-btn">Rename</button>
        <button id="action-delete" class="sheet-btn danger">Delete</button>
        <button id="action-cancel" class="sheet-btn cancel">Cancel</button>
      </div>
    </div>

    <div id="import-sheet" class="sheet-overlay hidden">
      <div id="import-sheet-backdrop" class="sheet-backdrop"></div>
      <div id="import-sheet-panel" class="sheet-panel">
        <button id="import-files-option" class="sheet-btn">Add Files</button>
        <button id="import-folder-option" class="sheet-btn">Add Folder</button>
        <button id="import-cancel" class="sheet-btn cancel">Cancel</button>
      </div>
    </div>

    <div id="settings-sheet" class="sheet-overlay hidden">
      <div id="settings-sheet-backdrop" class="sheet-backdrop"></div>
      <div id="settings-sheet-panel" class="sheet-panel">
        <h2>Settings</h2>

        <div class="settings-section">
          <span class="settings-label">Appearance</span>
          <div id="theme-picker">
            <button id="theme-light-btn" class="theme-option"></button>
            <button id="theme-dark-btn" class="theme-option"></button>
          </div>
        </div>

        <div class="settings-section">
          <span class="settings-label">Accent Color</span>
          <div id="accent-preview"></div>
          <div class="slider-track-wrap" id="hue-track-area">
            <div class="gradient-track hue-gradient"></div>
            <div id="hue-thumb" class="color-thumb"></div>
          </div>
          <div class="slider-track-wrap" id="sat-track-area">
            <div id="sat-track" class="gradient-track"></div>
            <div id="sat-thumb" class="color-thumb"></div>
          </div>
        </div>

        <button id="settings-close" class="sheet-btn cancel">Close</button>
      </div>
    </div>

  </body>
</html>
