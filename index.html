<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6c5ce7" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Music Streamer</title>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <h1>Music</h1>
        <input id="search" type="search" placeholder="Search library…" />
        <div class="import-buttons">
          <button id="add-files-btn" class="btn">＋ Files</button>
          <button id="add-folder-btn" class="btn">＋ Folder</button>
        </div>
      </header>

      <main id="library">
        <p id="empty-state">
          Your library is empty. Tap <strong>＋ Files</strong> or <strong>＋ Folder</strong>
          to import music from your phone's storage. Once imported, it's saved
          on-device and plays with no internet connection needed.
        </p>
        <ul id="track-list"></ul>
      </main>

      <footer id="player-bar" class="hidden">
        <div id="now-playing">
          <img id="np-art" alt="" />
          <div id="np-text">
            <div id="np-title">—</div>
            <div id="np-artist">—</div>
          </div>
        </div>

        <div id="seek-row">
          <span id="time-current">0:00</span>
          <input id="seek" type="range" min="0" max="1000" value="0" />
          <span id="time-total">0:00</span>
        </div>

        <div id="controls">
          <button id="shuffle-btn" class="ctrl" title="Shuffle">🔀</button>
          <button id="prev-btn" class="ctrl" title="Previous">⏮</button>
          <button id="play-btn" class="ctrl big" title="Play/Pause">▶</button>
          <button id="next-btn" class="ctrl" title="Next">⏭</button>
          <button id="repeat-btn" class="ctrl" title="Repeat">🔁</button>
        </div>
      </footer>
    </div>

    <input type="file" id="file-input" accept="audio/*,.flac,.m4a,.ogg,.wav,.mp3" multiple hidden />
    <input type="file" id="folder-input" webkitdirectory multiple hidden />
    <audio id="audio" preload="metadata"></audio>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
