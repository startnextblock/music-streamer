<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6c5ce7" />
    <link rel="icon" href="/music-streamer/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/music-streamer/icons/icon-192.png" />
    <title>Music Streamer</title>
    <script type="module" crossorigin src="/music-streamer/assets/index-BDy9ZVf1.js"></script>
    <link rel="modulepreload" crossorigin href="/music-streamer/assets/BasicParser-CQ38SJP4.js">
    <link rel="modulepreload" crossorigin href="/music-streamer/assets/Errors-DphxX0j4.js">
    <link rel="stylesheet" crossorigin href="/music-streamer/assets/index-DR-zqFnx.css">
  <link rel="manifest" href="/music-streamer/manifest.webmanifest"></head>
  <body>
    <div id="app">
      <header id="topbar">
        <h1>Music</h1>
        <input id="search" type="search" placeholder="Search library…" />
        <div class="import-buttons">
          <button id="add-files-btn" class="btn">＋ Files</button>
          <button id="add-folder-btn" class="btn">＋ Folder</button>
        </div>
      </header>

      <div id="import-status" class="hidden" role="status">
        <div id="import-bar"><div id="import-bar-fill"></div></div>
        <span id="import-text"></span>
      </div>

      <main id="library">
        <p id="empty-state">
          Your library is empty. Tap <strong>＋ Files</strong> or <strong>＋ Folder</strong>
          to import music from your phone's storage. Once imported, it's saved
          on-device and plays with no internet connection needed.
        </p>
        <ul id="track-list"></ul>
      </main>

      <footer id="player-bar" class="hidden">
        <div id="now-playing">
          <div id="np-title">—</div>
        </div>

        <div id="seek-row">
          <span id="time-current">0:00</span>
          <input id="seek" type="range" min="0" max="1000" value="0" />
          <span id="time-total">0:00</span>
        </div>

        <div id="controls">
          <div id="transport">
            <button id="shuffle-btn" class="ctrl" title="Shuffle">🔀</button>
            <button id="prev-btn" class="ctrl" title="Previous">⏮</button>
            <button id="play-btn" class="ctrl big" title="Play/Pause">▶</button>
            <button id="next-btn" class="ctrl" title="Next">⏭</button>
            <button id="repeat-btn" class="ctrl" title="Repeat">🔁</button>
          </div>
          <div id="volume-control">
            <button id="volume-btn" class="ctrl" title="Mute">🔊</button>
            <input id="volume" type="range" min="0" max="100" value="100" />
          </div>
        </div>
      </footer>
    </div>

    <input type="file" id="file-input" accept="audio/*,.flac,.m4a,.ogg,.wav,.mp3" multiple hidden />
    <input type="file" id="folder-input" webkitdirectory multiple hidden />
    <audio id="audio" preload="metadata"></audio>
    <div id="toast" role="status"></div>

    <div id="action-sheet" class="hidden">
      <div id="action-sheet-backdrop"></div>
      <div id="action-sheet-panel">
        <button id="action-rename" class="sheet-btn">Rename</button>
        <button id="action-delete" class="sheet-btn danger">Delete</button>
        <button id="action-cancel" class="sheet-btn cancel">Cancel</button>
      </div>
    </div>

  </body>
</html>
